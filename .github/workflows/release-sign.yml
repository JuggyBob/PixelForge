name: Signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (for example 1.0.1). The tag v<version> must already exist."
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-release:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      DOTNET_VERSION: "10.0.x"
      VERSION_INPUT: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_APP_CONFIG_SLUG: ${{ vars.SIGNPATH_APP_CONFIG_SLUG }}
      SIGNPATH_INSTALLER_CONFIG_SLUG: ${{ vars.SIGNPATH_INSTALLER_CONFIG_SLUG }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and verify tag
        id: version
        shell: pwsh
        run: |
          $version = $env:VERSION_INPUT
          if ([string]::IsNullOrWhiteSpace($version)) {
              $version = $env:REF_NAME
              if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid version '$version'. Use a semantic version such as 1.0.1."
          }
          $tag = "v$version"
          git rev-parse --verify "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Tag $tag does not exist. Create and push the tag before running this workflow." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Signing release $tag"

      - name: Verify SignPath configuration
        shell: pwsh
        run: |
          $missing = @()
          foreach ($name in @(
              "SIGNPATH_API_TOKEN",
              "SIGNPATH_ORGANIZATION_ID",
              "SIGNPATH_PROJECT_SLUG",
              "SIGNPATH_SIGNING_POLICY_SLUG",
              "SIGNPATH_APP_CONFIG_SLUG",
              "SIGNPATH_INSTALLER_CONFIG_SLUG")) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                  $missing += $name
              }
          }
          if ($missing.Count -gt 0) {
              throw "Missing SignPath configuration: $($missing -join ', '). See docs/SIGNPATH.md and configure the repository secret and variables."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Fetch build engines
        shell: pwsh
        run: .\scripts\fetch-dependencies.ps1 -SkipModels

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          Invoke-WebRequest -UseBasicParsing `
              -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe" `
              -OutFile $installer -TimeoutSec 600
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys") {
              throw "Inno Setup installer signature verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "InnoSetup7"
          Start-Process -FilePath $installer `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir") `
              -Wait
          if (-not (Test-Path (Join-Path $installDir "ISCC.exe"))) {
              throw "Inno Setup compiler was not installed at $installDir."
          }
          $installDir >> $env:GITHUB_PATH

      - name: Publish unsigned application
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version "${{ steps.version.outputs.version }}" -Stage publish

      - name: Stage application for signing
        shell: pwsh
        run: |
          $dir = "artifacts/signing/app"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "artifacts/publish/PixelForge/PixelForge.exe" (Join-Path $dir "PixelForge.exe") -Force
          Get-Item (Join-Path $dir "PixelForge.exe") | Select-Object FullName, Length

      - name: Upload unsigned application
        id: upload-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-pixelforge-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/signing/app
          if-no-files-found: error
          retention-days: 7

      - name: Sign application
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_APP_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed/app
          parameters: |
            product_version: "${{ steps.version.outputs.version }}"
            file_version: "${{ steps.version.outputs.version }}.0"

      - name: Verify signed application
        shell: pwsh
        run: .\scripts\verify-signatures.ps1 -Path "artifacts/signed/app/PixelForge.exe"

      - name: Package signed application
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version "${{ steps.version.outputs.version }}" -Stage package -SignedAppPath "artifacts/signed/app/PixelForge.exe"

      - name: Stage installer for signing
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $source = "artifacts/installer/PixelForge-$version-Setup.exe"
          $dir = "artifacts/signing/installer"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $source (Join-Path $dir "PixelForge-Setup.exe") -Force
          Get-Item (Join-Path $dir "PixelForge-Setup.exe") | Select-Object FullName, Length

      - name: Upload unsigned installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-pixelforge-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/signing/installer
          if-no-files-found: error
          retention-days: 7

      - name: Sign installer
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_INSTALLER_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed/installer
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Verify signed installer
        shell: pwsh
        run: .\scripts\verify-signatures.ps1 -Path "artifacts/signed/installer/PixelForge-Setup.exe"

      - name: Assemble release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $release = "artifacts/release/v$version"
          New-Item -ItemType Directory -Force $release | Out-Null

          Copy-Item "artifacts/portable/PixelForge-$version-portable.zip" `
              (Join-Path $release "PixelForge-Portable-$version-x64.zip") -Force
          Copy-Item "artifacts/signed/installer/PixelForge-Setup.exe" `
              (Join-Path $release "PixelForge-Setup-$version-x64.exe") -Force

          $files = Get-ChildItem $release -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $lines = foreach ($file in $files) {
              $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          $lines | Set-Content (Join-Path $release "SHA256SUMS.txt") -Encoding ascii

          Get-ChildItem $release -File | Select-Object Name, Length
          Get-Content (Join-Path $release "SHA256SUMS.txt")

      - name: Verify final assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $release = "artifacts/release/v$version"
          $setup = Join-Path $release "PixelForge-Setup-$version-x64.exe"
          $portable = Join-Path $release "PixelForge-Portable-$version-x64.zip"

          .\scripts\verify-signatures.ps1 -Path $setup

          $extract = Join-Path $env:RUNNER_TEMP "portable-signature-check"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $portable -DestinationPath $extract -Force
          .\scripts\verify-signatures.ps1 -Path (Join-Path $extract "PixelForge.exe")

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $release = "artifacts/release/v$version"
          $assets = @(
              (Join-Path $release "PixelForge-Setup-$version-x64.exe"),
              (Join-Path $release "PixelForge-Portable-$version-x64.zip"),
              (Join-Path $release "SHA256SUMS.txt")
          )

          $notes = (Get-Content "docs/RELEASE_NOTES_TEMPLATE.md" -Raw).Replace("{{VERSION}}", $version)
          $notesPath = Join-Path $env:RUNNER_TEMP "pixelforge-release-$version.md"
          $notes | Set-Content $notesPath -Encoding utf8

          $existingJson = gh release view $tag --json isDraft,isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0 -and $existingJson) {
              $existing = $existingJson | ConvertFrom-Json
              if (-not $existing.isDraft) {
                  throw "Release $tag is already published. Do not overwrite signed assets under an existing release; create a new version."
              }
              gh release upload $tag @assets --clobber
              if ($LASTEXITCODE -ne 0) { throw "Uploading signed assets failed." }
              gh release edit $tag --title "PixelForge $version" --notes-file $notesPath --draft
              if ($LASTEXITCODE -ne 0) { throw "Updating the draft release failed." }
          } else {
              gh release create $tag @assets --draft --verify-tag `
                  --title "PixelForge $version" --notes-file $notesPath
              if ($LASTEXITCODE -ne 0) { throw "Creating the draft release failed." }
          }

          Write-Host "Draft release ready: https://github.com/JuggyBob/PixelForge/releases/tag/$tag"
